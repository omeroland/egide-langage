# TEMPORARY (T-0024): formats the seed with ocamlformat in CI. Must NOT be merged.
name: fmt-bot
on:
  push:
    branches: [governance/t-0024-fmt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/t-0024-fmt
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          dune-cache: true
      - run: opam install . --deps-only --with-test --with-dev-setup -y
      - run: opam exec -- dune build
      - run: opam exec -- dune fmt || true
      - name: commit and push
        run: |
          if git diff --quiet; then echo "nothing to format"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "T-0024: apply ocamlformat 0.28.1"
          git push origin HEAD:governance/t-0024-fmt
